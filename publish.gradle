apply plugin: 'maven-publish'

// JitPack 配置
// JitPack 会自动从 GitHub 构建，只需要确保模块可以正常编译
// 更多信息：https://jitpack.io/docs/ANDROID/

def projectGroupId = "com.github.tongzhou-j"
def projectArtifactId = PUBLISH_ARTIFACT_ID
def projectVersionName = cfgs.versionName

println("JitPack 发布配置: ${projectGroupId}:${projectArtifactId}:${projectVersionName}")

def isAndroidProject = project.hasProperty('android')

if (isAndroidProject) {
    println("使用Android工程方式发布")
    
    // 创建 sources jar
    task sourcesJar(type: Jar) {
        archiveClassifier.set("sources")
        from android.sourceSets.main.java.srcDirs
        from android.sourceSets.main.kotlin.srcDirs
    }
} else {
    println("使用Java工程方式发布")
    task sourcesJar(type: Jar) {
        archiveClassifier.set("sources")
        from sourceSets.main.allJava
    }
}

// 配置发布
afterEvaluate {
    publishing {
        publications {
            aar(MavenPublication) {
                groupId = projectGroupId
                artifactId = projectArtifactId
                version = projectVersionName
                
                if (isAndroidProject) {
                    // 发布 AAR 文件
                    artifact("$buildDir/outputs/aar/${project.getName()}-release.aar")
                } else {
                    // 发布 JAR 文件
                    artifact("$buildDir/libs/${project.getName()}.jar")
                }
                
                // 发布源码
                artifact sourcesJar
                
                // POM 配置
                pom {
                    name = projectArtifactId
                    description = "${projectArtifactId} library for Android"
                    url = "https://github.com/tongzhou-j/PictureSelector"
                    licenses {
                        license {
                            name = "Apache-2.0"
                            url = "https://opensource.org/licenses/Apache-2.0"
                        }
                    }
                    developers {
                        developer {
                            id = "tongzhou-j"
                            name = "tongzhou-j"
                        }
                    }
                    scm {
                        connection = "scm:git:https://github.com/tongzhou-j/PictureSelector.git"
                        developerConnection = "scm:git:https://github.com/tongzhou-j/PictureSelector.git"
                        url = "https://github.com/tongzhou-j/PictureSelector"
                    }
                    
                    // 添加依赖信息
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')
                        
                        // 处理 api 依赖
                        if (project.configurations.findByName('api')) {
                            project.configurations.api.allDependencies.each {
                                if (it.group != null && it.name != null && it.version != null && !it.name.contains('unspecified')) {
                                    def dependencyNode = dependenciesNode.appendNode('dependency')
                                    dependencyNode.appendNode('groupId', it.group)
                                    dependencyNode.appendNode('artifactId', it.name)
                                    dependencyNode.appendNode('version', it.version)
                                    dependencyNode.appendNode('scope', 'compile')
                                }
                            }
                        }
                        
                        // 处理 implementation 依赖
                        project.configurations.implementation.allDependencies.each {
                            if (it.group != null && it.name != null && it.version != null && !it.name.contains('unspecified')) {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', it.group)
                                dependencyNode.appendNode('artifactId', it.name)
                                dependencyNode.appendNode('version', it.version)
                                dependencyNode.appendNode('scope', 'runtime')
                            }
                        }
                    }
                }
            }
        }
        
        // JitPack 不需要配置仓库，但可以配置本地仓库用于测试
        repositories {
            mavenLocal()
        }
    }
}
